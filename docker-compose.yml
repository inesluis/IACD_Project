services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is new; the pipelines also apply it at start-up.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
