url: "https://api.open-meteo.com/v1/forecast"

# Only used by the notebook in tests/. The pipeline reads the location of
# each installation from installations.yaml.
latitude: 40.2069
longitude: -8.42

# temperature_2m stays first: the notebook reads variable 0 as temperature.
hourly:
  - temperature_2m
  - global_tilted_irradiance
  - wind_speed_10m

forecast_days: 7

# Change model_version whenever the formula or a constant below changes.
model_version: physical-v1
constants:
  noct: 45.0      # nominal operating cell temperature, in C
  gamma: -0.004   # power lost per C above 25 C in the cell
  pr: 0.80        # performance ratio: inverter, cabling and soiling losses
